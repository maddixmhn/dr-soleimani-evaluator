name: Semester enrolment audit
on: workflow_dispatch
permissions:
  contents: write
concurrency:
  group: semester-report
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/review_cloud.py
      - name: Publish synthetic report
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add semester/events.json
          git commit -m "Publish semester audit from run ${GITHUB_RUN_ID}"
          git push
